name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: web (typecheck + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Typecheck & test
        working-directory: web
        run: npm run check
      - name: Build bundle
        working-directory: web
        run: npm run build

  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum
      - name: Install Linux WebKitGTK deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build web assets
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Sync embedded desktop assets
        run: node web/scripts/desktop-assets.mjs sync
      - name: Vet desktop
        working-directory: desktop
        shell: bash
        run: |
          TAGS="desktop,production"
          export CGO_ENABLED=1
          if [ "$RUNNER_OS" = "Linux" ]; then
            TAGS="$TAGS,webkit2_41"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            export CGO_ENABLED=0
          fi
          go vet -tags "$TAGS" ./...
      - name: Test desktop
        working-directory: desktop
        shell: bash
        run: |
          TAGS="desktop,production"
          export CGO_ENABLED=1
          if [ "$RUNNER_OS" = "Linux" ]; then
            TAGS="$TAGS,webkit2_41"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            export CGO_ENABLED=0
          elif [ "$RUNNER_OS" = "macOS" ]; then
            ORIG_DEFAULT=$((security default-keychain -d user 2>/dev/null || true) | sed -e 's/^[[:space:]]*//' -e 's/^"//' -e 's/"$//')
            ORIG_LIST=()
            while IFS= read -r line; do
              kc=$(printf '%s' "$line" | sed -e 's/^[[:space:]]*//' -e 's/^"//' -e 's/"$//')
              if [ -n "$kc" ]; then
                ORIG_LIST+=("$kc")
              fi
            done < <(security list-keychains -d user 2>/dev/null || true)
            KC="${RUNNER_TEMP:-/tmp}/af-studio-ci-$$.keychain-db"
            cleanup_keychain() {
              if [ "${#ORIG_LIST[@]}" -gt 0 ]; then
                security list-keychains -d user -s "${ORIG_LIST[@]}" >/dev/null 2>&1 || true
              fi
              if [ -n "$ORIG_DEFAULT" ]; then
                security default-keychain -d user -s "$ORIG_DEFAULT" >/dev/null 2>&1 || true
              fi
              security delete-keychain "$KC" >/dev/null 2>&1 || true
            }
            trap cleanup_keychain EXIT
            security create-keychain -p "ci-test" "$KC"
            security set-keychain-settings -t 3600 -u "$KC"
            security unlock-keychain -p "ci-test" "$KC"
            security default-keychain -d user -s "$KC"
            security list-keychains -d user -s "$KC" "${ORIG_LIST[@]}"
          fi
          go test -tags "$TAGS" ./...
      - name: Build desktop
        working-directory: desktop
        shell: bash
        run: |
          TAGS="desktop,production"
          BIN="agentflow-studio"
          export CGO_ENABLED=1
          if [ "$RUNNER_OS" = "Linux" ]; then
            TAGS="$TAGS,webkit2_41"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            export CGO_ENABLED=0
            BIN="agentflow-studio.exe"
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            go build -tags "$TAGS" -trimpath -ldflags "-s -w -H windowsgui" -o "$BIN" .
          else
            go build -tags "$TAGS" -trimpath -ldflags "-s -w" -o "$BIN" .
          fi
