name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: web (typecheck + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Typecheck & test
        working-directory: web
        run: npm run check
      - name: Build bundle
        working-directory: web
        run: npm run build

  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum
      - name: Install Linux WebKitGTK deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build web assets
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Sync embedded desktop assets
        run: node web/scripts/desktop-assets.mjs sync
      - name: Vet, test & build desktop
        working-directory: desktop
        shell: bash
        run: |
          TAGS="desktop,production"
          BIN="agentflow-studio"
          export CGO_ENABLED=1
          if [ "$RUNNER_OS" = "Linux" ]; then
            TAGS="$TAGS,webkit2_41"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            export CGO_ENABLED=0
            BIN="agentflow-studio.exe"
          fi
          go vet -tags "$TAGS" ./...
          go test -tags "$TAGS" ./...
          if [ "$RUNNER_OS" = "Windows" ]; then
            go build -tags "$TAGS" -trimpath -ldflags "-s -w -H windowsgui" -o "$BIN" .
          else
            go build -tags "$TAGS" -trimpath -ldflags "-s -w" -o "$BIN" .
          fi
