# agentflow loop test examples/telegram-group-bot/tests/group_bot.yaml
agent: group_bot
loop: ../loops/group_bot.ts
extras:
  respond_on_mention: true
  respond_on_reply: true
  respond_in_dm: true
  trigger_phrase: "!bot"
  cooldown_sec: 15
  store_all_messages: true
  retention_turns: 20

messages:
  # 1. Ordinary group message: stays quiet via session.skip("not_mentioned"),
  #    and enters working context because store_all_messages is true.
  - from: alice
    channel: telegram
    text: "hey everyone, the release build finished"
    payload:
      chat_type: supergroup
      chat_id: "-1001"
      name: Alice
      mentioned: false

  # 2. Direct @-mention: recalls Alice's retained message in prompt and answers.
  - from: bob
    channel: telegram
    text: "@helper_bot what just happened?"
    payload:
      chat_type: supergroup
      chat_id: "-1001"
      name: Bob
      mentioned: true

  # 3. Immediate follow-up mention within cooldown_sec: stays quiet via session.skip("cooldown").
  - from: carol
    channel: telegram
    text: "@helper_bot summarize that too!"
    payload:
      chat_type: supergroup
      chat_id: "-1001"
      name: Carol
      mentioned: true

llm:
  - match: "release build finished"
    text: "Alice noted that the release build finished."

expect:
  - "Alice noted that the release build finished."

expect_ops:
  - session.state.get
  - session.skip
  - session.state.get
  - llm.chat
  - session.state.set
  - session.skip
