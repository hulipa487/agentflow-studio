# Telegram group bot starter with Studio settings and per-group memory.
#
# Quick start:
#   export CREDENTIALS_MASTER_KEY=...  CLOUDFLARE_ACCOUNT_ID=...
#   for name in openai telegram gemini xai cloudflare; do
#     agentflow cred set "$name" -config examples/telegram-group-bot/agentflow.yaml
#   done
#   agentflow validate -config examples/telegram-group-bot/agentflow.yaml
#   agentflow -config examples/telegram-group-bot/agentflow.yaml
#
# Or edit everything visually in AgentFlow Studio (Starter Settings, Channel Tester, Event Center).

version: "1"

runtime:
  persistence: sqlite://./data/agentflow.db
  credentials:
    enabled: true            # master key from CREDENTIALS_MASTER_KEY
    engine_wide: maintenance
  studio:
    enabled: true
  sessions:
    idle_unload: 30m

models:
  default:
    provider: openai
    model: ${CHAT_MODEL:-gpt-4.1-mini}
    base_url: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    api_key: cred:openai

search:
  default: google_search
  engines:
    google_search:
      api_key: cred:gemini
    x_search:
      api_key: cred:xai

browser:
  account_id: ${CLOUDFLARE_ACCOUNT_ID}
  api_token: cred:cloudflare

agents:
  group_bot:
    loop: ./loops/group_bot.ts
    model: default
    instructions: ./prompts/assistant.md
    memory: conversational
    history_budget: 6000
    capabilities: [llm.chat, memory, session.state, tools]
    skills: [builtin:web_search, builtin:browser, builtin:fetch]
    extras:
      respond_on_mention: true
      respond_on_reply: true
      respond_in_dm: true
      trigger_phrase: ""
      cooldown_sec: 15
      store_all_messages: false
      retention_turns: 20

gateway:
  listen: 127.0.0.1:8080
  channels:
    - type: telegram
      name: telegram
      agent: group_bot
      token: cred:telegram
      mode: polling
