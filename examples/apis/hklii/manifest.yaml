name: hklii
version: "1.0.0"
description: "Hong Kong Legal Information Institute (HKLII) case & legislation search and judgment reader"
runtime: script
entry: ./index.ts
timeout: 30s
capabilities:
  http:
    allowed_hosts: ["www.hklii.hk"]
actions:
  search:
    description: "Search Hong Kong case law and legislation on HKLII. Returns normalized hits (title, path, url, court, date, neutral, parallel, action, parties, coram) and total count; pass a case hit's path to read."
    expose_as_tool: true
    parameters:
      type: object
      required: [query]
      properties:
        query:
          type: string
          description: "Free-text legal query: party names, neutral/parallel citation, or legal concepts"
        count:
          type: number
          description: "Max results to return (default 10, max 2500)"
        disable_fuzzy:
          type: boolean
          description: "true = exact keyword match; false = concept/fuzzy match (default false)"
        base_url:
          type: string
          description: "Optional HKLII base URL override (default https://www.hklii.hk)"
  read:
    description: "Read one HKLII case judgment's full plain text by path (/{lang}/cases/{abbr}/{year}/{num}) or explicit abbr+year+num. Legislation hits (e.g. Hong Kong Ordinances under /legis/) have no judgment body and are rejected. Long judgments support start/max_chars paging."
    expose_as_tool: true
    parameters:
      type: object
      properties:
        path:
          type: string
          description: "Case path from a search hit, e.g. /en/cases/hkcfi/2020/1808"
        abbr:
          type: string
          description: "Court/database abbreviation (e.g. hkcfi) when not passing path"
        year:
          type: string
          description: "Case year (e.g. 2020) when not passing path"
        num:
          type: string
          description: "Case number within the year (e.g. 1808) when not passing path"
        lang:
          type: string
          enum: ["en", "tc", "sc"]
          description: "Language version override (default: from path, else en)"
        start:
          type: number
          description: "Character offset into the plain-text body for paged reading (default 0)"
        max_chars:
          type: number
          description: "Maximum characters to return (0 or omitted = no cap)"
        base_url:
          type: string
          description: "Optional HKLII base URL override (default https://www.hklii.hk)"
