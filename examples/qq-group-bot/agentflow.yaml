# QQ group bot starter with Studio settings and per-group memory.
#
# Quick start:
#   export CREDENTIALS_MASTER_KEY=...  QQ_APPID=102xxxxxx
#   for name in openai doubao qq_app_secret; do
#     agentflow cred set "$name" -config examples/qq-group-bot/agentflow.yaml
#   done
#   agentflow validate -config examples/qq-group-bot/agentflow.yaml
#   agentflow -config examples/qq-group-bot/agentflow.yaml
#
# Or edit everything visually in AgentFlow Studio (Starter Settings, Channel Tester, Event Center).

version: "1"

runtime:
  persistence: sqlite://./data/agentflow.db
  credentials:
    enabled: true            # master key from CREDENTIALS_MASTER_KEY
    engine_wide: maintenance
  studio:
    enabled: true
  sessions:
    idle_unload: 30m

models:
  default:
    provider: openai
    model: ${CHAT_MODEL:-gpt-4.1-mini}
    base_url: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    api_key: cred:openai

search:
  default: doubao
  engines:
    doubao:
      api_key: cred:doubao

agents:
  qq_group_bot:
    loop: ./loops/group_bot.ts
    model: default
    instructions: ./prompts/assistant.md
    memory: conversational
    history_budget: 6000
    capabilities: [llm.chat, memory, session.state, tools]
    skills: [builtin:web_search, builtin:fetch]
    extras:
      respond_on_mention: true
      respond_on_reply: true
      respond_in_c2c: true
      respond_in_guild: false
      bot_names: ""
      trigger_phrase: ""
      reply_on_relevant: true
      cooldown_sec: 15
      store_all_messages: true
      retention_turns: 20

gateway:
  listen: 127.0.0.1:8080
  channels:
    - type: qq
      name: qq
      agent: qq_group_bot
      app_id: ${QQ_APPID}
      secret: cred:qq_app_secret
      mode: websocket
      scenes: [group, group_all, c2c]
      markdown: true
